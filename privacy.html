<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隱私權｜K Esports Lab</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><img src="assets/img/k-logo.svg" alt=""><span>K ESPORTS LAB<small>隱私權政策</small></span></a></div></header><main class="shell legal"><div class="card"><h1>隱私權政策（MVP 草案）</h1><p>第一版尚未建立正式會員系統，也不會在本 MVP 直接處理信用卡資料。正式上線後，付款資料應由合作金流服務商依其安全機制處理。</p><h2>可能蒐集的資料</h2><p>正式版可能因會員登入、訂單紀錄、客服需求而蒐集必要的聯絡與交易識別資訊；會以提供服務所需的最小範圍為原則。</p><h2>網站分析</h2><p>若未來導入流量分析服務，將在正式政策中揭露所使用的工具與 Cookie／識別技術。</p></div></main></body></html>
