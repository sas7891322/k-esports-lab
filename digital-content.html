<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數位內容與退款說明｜K Esports Lab</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><img src="assets/img/k-logo.svg" alt=""><span>K ESPORTS LAB<small>數位內容與退款說明</small></span></a></div></header><main class="shell legal"><div class="card"><h1>數位內容／退款說明（MVP 草案）</h1><p>本頁目前僅作為網站架構與金流審核準備用。正式收費前，會依合作金流服務商與適用法規調整文字與消費者同意流程。</p><h2>K Premium 商品</h2><p>K Premium 為單篇電子競技賽事分析數位內容，預計採單次付款後解鎖指定文章的方式提供。</p><h2>提供時間</h2><p>正式版預計於付款成功後立即解鎖已購買文章，並於會員帳號保留購買紀錄。</p><h2>退款與解除權</h2><p>正式上線前會建立清楚的數位內容提供與消費者同意機制；實際退費條件以正式購買頁顯示之條款為準。</p></div></main></body></html>
