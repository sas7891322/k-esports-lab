<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>內容管理工具｜K Esports Lab</title><link rel="icon" href="assets/img/k-logo.svg"><link rel="stylesheet" href="assets/css/styles.css"></head><body>
<header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><img src="assets/img/k-logo.svg" alt=""><span>K ESPORTS LAB<small>內容管理工具</small></span></a><nav class="nav"><button id="adminTopLogout" class="nav-logout" type="button">登出</button><a href="index.html">前台</a><a class="active" href="admin-login.html">管理工具</a></nav><button id="menuBtn" class="menu-btn">☰</button></div><div id="mobileMenu" class="mobile-menu shell"><a href="index.html">返回前台</a><button id="adminMobileLogout" class="mobile-logout" type="button">登出</button></div></header>
<main class="shell"><div id="adminAccessCheck" class="admin-access-check"><div class="card"><strong>正在驗證管理員權限…</strong></div></div><div id="adminApp" class="admin-wrap" hidden><div class="admin-main">
<section class="card form-card"><h2 id="formTitle">新增賽事</h2>
<form id="matchForm">
  <div class="form-grid">
    <div class="form-field"><label>賽區</label><select id="fLeague" class="select"><option>LCK</option><option>LPL</option><option>LCP</option><option>LEC</option><option>LCS</option><option>CBLOL</option></select></div>
    <div class="form-field"><label>日期</label><input id="fDate" type="date" class="input" required></div>
    <div class="form-field"><label>預定時間</label><div class="time-select-group"><select id="fTimeHour" class="select" aria-label="小時"><option value="">小時</option><option value="00">00</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select><span class="time-separator">:</span><select id="fTimeMinute" class="select" aria-label="分鐘"><option value="00">00</option><option value="30">30</option></select></div></div>
    <div class="form-field"><label>賽制</label><select id="fBo" class="select"><option>BO3</option><option>BO5</option><option>BO1</option></select></div>

    <div class="form-field"><label>A 隊</label><select id="fTeamASelect" class="select" required></select><div id="fTeamAPreview" class="admin-team-preview"></div></div>
    <div class="form-field"><label>B 隊</label><select id="fTeamBSelect" class="select" required></select><div id="fTeamBPreview" class="admin-team-preview"></div></div>

    <div class="form-field full"><div class="eyebrow">賽事基本內容</div><small style="color:var(--muted);line-height:1.6">一般賽事：分析看法、賽事傾向、預測比分全部公開。焦點賽事：付款前只公開分析看法。</small></div>
    <div class="form-field full"><label>分析看法</label><textarea id="fPreview" class="textarea" placeholder="整體判斷與賽前觀察"></textarea></div>
    <div class="form-field"><label>賽事傾向</label><input id="fPrimary" class="input" placeholder="例如：GEN 系列賽勝出"></div>
    <div class="form-field"><label>預測比分</label><input id="fPrediction" class="input" placeholder="例如：GEN 2：1 HLE"></div>

    <div class="form-field full premium-toggle-row">
      <label class="checkline premium-checkline"><input id="fPremium" type="checkbox"> 設為焦點賽事＋K Premium</label>
      <small>未勾選：分析看法、賽事傾向、預測比分全部公開。勾選後：付款前只公開分析看法；完成解鎖後才顯示雙方勝負條件、不確定性提醒、關鍵勝負節點、賽事傾向與預測比分。</small>
    </div>

    <div id="premiumFields" class="premium-admin-fields full" hidden>
      <div class="premium-admin-head">
        <div><div class="eyebrow">K PREMIUM</div><h3>付費解鎖內容</h3></div>
        <div class="premium-price-field"><label>解鎖價格</label><input id="fPrice" type="number" class="input" value="39" min="0"></div>
      </div>
      <div class="form-grid premium-inner-grid">
        <div class="form-field full"><label>雙方勝負條件</label><textarea id="fConditions" class="textarea" placeholder="雙方各自較合理的勝利腳本"></textarea></div>
        <div class="form-field full"><label>不確定性提醒</label><textarea id="fRisk" class="textarea" placeholder="可能推翻原始判斷的主要變數"></textarea></div>
        <div class="form-field full"><label>關鍵勝負節點</label><textarea id="fSecondary" class="textarea" placeholder="最可能改變系列賽走向的關鍵節點"></textarea></div>
      </div>
    </div>

    <div class="form-field full"><button class="btn btn-primary" type="submit">儲存賽事</button></div>
  </div>
</form></section>
<section class="card form-card"><h2>賽事管理</h2><div id="adminList" class="admin-list"></div></section>
</div></div></main>
<div id="globalModal" class="modal"><div class="modal-card"><h3 data-modal-title></h3><p data-modal-text></p><div class="modal-actions"><button class="btn btn-secondary" data-modal-close>關閉</button></div></div></div>
<script src="assets/js/teams.js"></script>
<script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/admin.js"></script></body></html>
