<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>內容管理工具｜K Esports Lab</title><link rel="icon" href="assets/img/k-logo.svg"><link rel="stylesheet" href="assets/css/styles.css"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/img/k-app-180.png"></head><body>
<header class="topbar"><div class="shell topbar-inner"><a class="brand" href="index.html"><img src="assets/img/k-logo.svg" alt=""><span>K ESPORTS LAB<small>內容管理工具</small></span></a><nav class="nav"><button id="adminTopLogout" class="nav-logout" type="button">登出</button><a href="index.html">前台</a><a class="active" href="admin-login.html">管理工具</a></nav><button id="menuBtn" class="menu-btn">☰</button></div><div id="mobileMenu" class="mobile-menu shell"><a href="index.html">返回前台</a><button id="adminMobileLogout" class="mobile-logout" type="button">登出</button></div></header>
<main class="shell"><div id="adminAccessCheck" class="admin-access-check"><div class="card"><strong>正在驗證管理員權限…</strong></div></div><div id="adminApp" class="admin-wrap" hidden><div class="admin-main">
<section class="card form-card"><h2 id="formTitle">新增賽事</h2>
<form id="matchForm">
  <div class="form-grid">
    <div class="form-field"><label>賽區</label><select id="fLeague" class="select"><option>LCK</option><option>LPL</option><option>LCP</option><option>LEC</option><option>LCS</option><option>CBLOL</option></select></div>
    <div class="form-field"><label>日期</label><div class="picker-input-wrap"><input id="fDate" type="date" class="input picker-input" required><button class="picker-trigger" type="button" data-picker="#fDate" aria-label="選擇日期">選日期</button></div></div>
    <div class="form-field admin-time-field"><label>預定時間</label><div class="picker-input-wrap desktop-time-picker"><input id="fTime" type="time" step="1800" class="input picker-input"><button class="picker-trigger" type="button" data-picker="#fTime" aria-label="選擇時間">選時間</button></div><div class="mobile-time-selects" aria-label="手機版預定時間"><label><span>時</span><select id="fTimeHour" class="select"></select></label><span class="mobile-time-colon">：</span><label><span>分</span><select id="fTimeMinute" class="select"><option value="00">00</option><option value="30">30</option></select></label></div></div>
    <div class="form-field"><label>賽制</label><select id="fBo" class="select"><option>BO3</option><option>BO5</option><option>BO1</option></select></div>

    <div class="form-field"><label>A 隊</label><select id="fTeamASelect" class="select" required></select><div id="fTeamAPreview" class="admin-team-preview"></div></div>
    <div class="form-field"><label>B 隊</label><select id="fTeamBSelect" class="select" required></select><div id="fTeamBPreview" class="admin-team-preview"></div></div>

    <div class="form-field full">
      <label>分析看法</label>
      <textarea id="fPreview" class="textarea" placeholder="公開顯示的分析看法與基本判斷"></textarea>
    </div>
    <div class="form-field"><label>賽事觀點</label><input id="fPrimary" class="input" placeholder="例如：GEN 系列賽勝"></div>
    <div class="form-field"><label>預測比分</label><input id="fPrediction" class="input" placeholder="例如：GEN 2：1 HLE"></div>

    <div class="form-field full premium-toggle-row">
      <label class="checkline premium-checkline"><input id="fPremium" type="checkbox"> 設為 K Premium 焦點賽事</label>
      <small>未勾選：一般賽事，分析看法、賽事觀點、預測比分公開。勾選後可先建立「焦點賽事預告」，之後再發布完整分析。</small>
    </div>

    <div id="premiumPublishRow" class="form-field full premium-publish-row" hidden>
      <label class="checkline premium-checkline"><input id="fAnalysisPublished" type="checkbox" checked> 分析內容已發布</label>
      <small><b>取消勾選＝焦點賽事預告模式。</b> 前台只顯示日期、時間、對戰與「賽事提醒」，不顯示分析內容、也不開放購買。之後編輯本場、勾選此項再儲存時，系統會通知已設定提醒的使用者。</small>
    </div>

    <div id="premiumFields" class="premium-admin-fields full" hidden>
      <div class="premium-admin-head">
        <div><div class="eyebrow">K PREMIUM</div><h3>深度分析內容</h3></div>
        <div class="premium-price-field"><label>解鎖價格</label><input id="fPrice" type="number" class="input" value="39" min="0"></div>
      </div>
      <div class="form-grid premium-inner-grid">
        <div class="form-field full"><label>雙方勝負條件</label><textarea id="fConditions" class="textarea" placeholder="整理雙方較合理的取勝腳本與失敗風險"></textarea></div>
        <div class="form-field full"><label>不確定性提醒</label><textarea id="fRisk" class="textarea" placeholder="整理可能推翻原始判斷的主要變數"></textarea></div>
        <div class="form-field full"><label>關鍵勝負節點</label><textarea id="fKeyPoint" class="textarea" placeholder="整理最可能改變系列賽走向的關鍵時間點或事件"></textarea></div>
      </div>
    </div>

    <div class="form-field full"><button class="btn btn-primary" type="submit">儲存賽事</button></div>
  </div>
</form></section>
<section class="card form-card"><h2>賽事管理</h2><div id="adminList" class="admin-list"></div></section>
</div></div></main>
<div id="globalModal" class="modal"><div class="modal-card"><h3 data-modal-title></h3><p data-modal-text></p><div class="modal-actions"><button class="btn btn-secondary" data-modal-close>關閉</button></div></div></div>
<script src="assets/js/teams.js"></script>
<script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/admin.js"></script><script src="assets/js/admin-auto-result.js"></script></body></html>
